            displayAnswerOptions() {
                const optionsContainer = document.getElementById('answerOptions');
                optionsContainer.innerHTML = '';
                
                this.currentQuestion.options.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.className = 'answer-btn';
                    button.textContent = option;
                    button.style.animationDelay = `${index * 0.1}s`;
                    button.addEventListener('click', () => {
                        this.checkAnswer(option, button);
                    });
                    optionsContainer.appendChild(button);
                });
            }

            checkAnswer(selectedAnswer, buttonElement) {
                const isCorrect = selectedAnswer === this.currentQuestion.correct || 
                    selectedAnswer.toString() === this.currentQuestion.correct.toString();
                
                document.querySelectorAll('.answer-btn').forEach(btn => {
                    btn.disabled = true;
                });
                
                document.getElementById('hintBtn').classList.add('hidden');
                
                if (isCorrect) {
                    buttonElement.classList.add('correct');
                    this.score += Math.max(10 - this.hintsUsed * 2, 5);
                    this.streak++;
                    this.questionsCorrect++;
                    
                    this.playSound('correct');
                    
                    const phrases = [
                        "Amazing! You got it! 🌟",
                        "Fantastic work! 🎉",
                        "You're a math star! ⭐",
                        "Brilliant! Keep going! 🚀",
                        "Super job! 👏",
                        "Excellent! You're doing great! 💪",
                        "Wonderful! 🌈",
                        "Perfect! 🏆"
                    ];
                    
                    const phrase = phrases[Math.floor(Math.random() * phrases.length)];
                    this.showFeedback('correct', phrase);
                    
                    setTimeout(() => {
                        this.speak(phrase.replace(/[^\w\s]/g, ''));
                    }, 200);
                    
                    this.celebrate();
                } else {
                    buttonElement.classList.add('incorrect');
                    this.streak = 0;
                    
                    this.playSound('incorrect');
                    
                    document.querySelectorAll('.answer-btn').forEach(btn => {
                        if (btn.textContent === this.currentQuestion.correct.toString()) {
                            btn.classList.add('correct');
                        }
                    });
                    
                    const encouragements = [
                        `Good try! The answer is ${this.currentQuestion.correct}. 💪`,
                        `Almost! It's ${this.currentQuestion.correct}. Keep trying! 🌱`,
                        `Nice effort! The correct answer is ${this.currentQuestion.correct}. 👍`,
                        `That's okay! It's ${this.currentQuestion.correct}. You're learning! 📚`
                    ];
                    
                    const feedback = encouragements[Math.floor(Math.random() * encouragements.length)];
                    this.showFeedback('incorrect', feedback);
                    
                    setTimeout(() => {
                        this.speak(feedback.replace(/[^\w\s]/g, ''));
                    }, 200);
                }
                
                this.hintsUsed = 0;
                this.updateScore();
                this.updateStars();
                document.getElementById('nextBtn').classList.remove('hidden');
            }

            showFeedback(type, message) {
                const feedback = document.getElementById('feedback');
                feedback.textContent = message;
                feedback.className = `feedback ${type}`;
                feedback.style.display = 'block';
            }

            clearFeedback() {
                document.getElementById('feedback').style.display = 'none';
                document.getElementById('storyArea').innerHTML = '';
                
                document.querySelectorAll('.answer-btn').forEach(btn => {
                    btn.disabled = false;
                    btn.classList.remove('correct', 'incorrect');
                });
            }

            showHint() {
                if (this.currentQuestion.hint) {
                    this.hintsUsed++;
                    this.showFeedback('hint', `💡 Hint: ${this.currentQuestion.hint}`);
                    this.speak(`Here's a hint: ${this.currentQuestion.hint}`);
                }
            }

            updateScore() {
                document.getElementById('scoreValue').textContent = this.score;
                document.getElementById('streakValue').textContent = this.streak;
            }

            updateStars() {
                const stars = document.querySelectorAll('.star');
                const percentage = this.questionsCorrect / Math.max(this.questionCount, 1);
                
                stars.forEach((star, index) => {
                    if (percentage > (index + 1) * 0.25) {
                        star.textContent = '⭐';
                        star.classList.add('earned');
                    } else {
                        star.textContent = '☆';
                        star.classList.remove('earned');
                    }
                });
            }

            updateProgress() {
                const progress = (this.questionCount / this.totalQuestions) * 100;
                document.getElementById('progressFill').style.width = `${progress}%`;
                document.getElementById('currentQ').textContent = this.questionCount;
                document.getElementById('totalQ').textContent = this.totalQuestions;
                document.getElementById('progressPercent').textContent = `${Math.round(progress)}%`;
            }

            celebrate() {
                const celebration = document.getElementById('celebration');
                const colors = ['#FF6B9D', '#5DADE2', '#58D68D', '#F5B041', '#9B59B6', '#F7DC6F'];
                const shapes = ['●', '★', '♥', '◆', '▲'];
                
                for (let i = 0; i < 30; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.color = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.fontSize = (Math.random() * 15 + 10) + 'px';
                    confetti.textContent = shapes[Math.floor(Math.random() * shapes.length)];
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    celebration.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 4000);
                }
            }

            endGame() {
                const percentage = Math.round((this.questionsCorrect / this.totalQuestions) * 100);
                let badge, badgeText, message;
                
                if (percentage >= 90) {
                    badge = '🏆';
                    badgeText = 'Math Champion!';
                    message = "Outstanding! You're a math superstar!";
                } else if (percentage >= 80) {
                    badge = '🌟';
                    badgeText = 'Math Star!';
                    message = "Excellent work! You're doing amazing!";
                } else if (percentage >= 70) {
                    badge = '🎯';
                    badgeText = 'Great Effort!';
                    message = "Good job! Keep practicing!";
                } else if (percentage >= 50) {
                    badge = '📚';
                    badgeText = 'Keep Learning!';
                    message = "Nice try! Practice makes perfect!";
                } else {
                    badge = '🌱';
                    badgeText = 'Growing Learner!';
                    message = "Don't give up! You're getting better!";
                }
                
                const gameArea = document.getElementById('gameArea');
                gameArea.innerHTML = `
                    <div class="end-game">
                        <h2>🎉 Adventure Complete! 🎉</h2>
                        <p class="final-score">${message}</p>
                        <div class="achievement-badge">
                            <span class="badge-icon">${badge}</span>
                            <span class="badge-text">${badgeText}</span>
                        </div>
                        <p class="final-score">
                            You got <strong>${this.questionsCorrect}</strong> out of <strong>${this.totalQuestions}</strong> correct!<br>
                            Final Score: <strong>${this.score}</strong> points
                        </p>
                        <div class="controls">
                            <button class="control-btn primary" id="playAgainBtn">🔄 Play Again</button>
                            <button class="control-btn secondary" id="changeTopic">📚 New Topic</button>
                        </div>
                    </div>
                `;
                
                document.getElementById('playAgainBtn').addEventListener('click', () => {
                    this.selectTopic(this.currentTopic);
                });
                
                document.getElementById('changeTopic').addEventListener('click', () => {
                    this.showTopicSelection();
                });
                
                setTimeout(() => {
                    this.speak(message);
                }, 500);
                
                if (percentage >= 70) {
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => this.celebrate(), i * 500);
                    }
                }
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            new MathQuestApp();
        });
    </script>
</body>
</html>
