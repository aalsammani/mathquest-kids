<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#8B6FF0">
<meta name="description" content="MathQuest Kids: reasoning-centered math adventures in four learning levels. No ads, no accounts, works offline.">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>MathQuest Kids</title>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="clouds" aria-hidden="true"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
<div class="app">
  <header class="topbar">
    <button id="btn-back" class="icon-btn" type="button" aria-label="Go back">←</button>
    <button id="btn-home" class="icon-btn" type="button" aria-label="Home">🏠</button>
    <div class="brand">
      <div class="logo" aria-hidden="true">🧮</div>
      <h1>MathQuest Kids<small>Think · Explain · Solve</small></h1>
    </div>
    <div class="spacer"></div>
    <div class="stat-pill" title="Coins"><span aria-hidden="true">🪙</span><span class="num" id="hud-coins">0</span><span class="sr-only">coins</span></div>
    <div class="stat-pill" id="pill-badges" title="Badges"><span aria-hidden="true">🏅</span><span class="num" id="hud-badges">0</span><span class="sr-only">badges</span></div>
    <button class="profile-chip" id="btn-profile" type="button" aria-label="My collection"><span class="pc-m" aria-hidden="true">🦊</span><span class="pc-n">Explorer</span></button>
    <button class="icon-btn" id="btn-settings" type="button" aria-label="Settings">⚙️</button>
  </header>
  <main id="main" tabindex="-1"><p class="offline-note" style="margin-top:40px">Loading MathQuest Kids…</p></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="confetti-layer" aria-hidden="true"></div>
<div class="sr-only" aria-live="polite" id="sr-live"></div>
<div id="print-area"></div>
<noscript><p style="padding:20px;font-family:sans-serif">MathQuest Kids needs JavaScript to run.</p></noscript>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
