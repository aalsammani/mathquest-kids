# Build, test and deploy MathQuest Kids to GitHub Pages.
#
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Site URL: https://<owner>.github.io/<repository>/  (e.g. https://aalsammani.github.io/mathquest-kids/)
#
# Only the compiled production build (dist-pages/) is published, never the TypeScript source.
# The Android/iOS (Capacitor) build is separate (`npm run build` → dist/, relative paths) and is
# not affected by this workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code, write to Pages, and sign the deployment (OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  CI: 'true'
  # Use Playwright's bundled Chromium on the runner (local runs default to Microsoft Edge).
  PW_CHANNEL: chromium

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Set the site base path
        # "/mathquest-kids" for a project site → "/mathquest-kids/"; "" for a user site → "/".
        run: |
          BASE="${{ steps.pages.outputs.base_path }}/"
          echo "BASE_PATH=$BASE" >> "$GITHUB_ENV"
          echo "Site base path: $BASE"
          echo "Site URL: ${{ steps.pages.outputs.base_url }}/"

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit, property and mutation tests
        run: npm test

      - name: Mathematical validation (364 generator combinations)
        run: npm run validate:math

      - name: Build the production site for GitHub Pages
        run: npx vite build --mode pages --outDir dist-pages

      - name: Verify the compiled output
        run: node scripts/verify-pages-build.mjs dist-pages "$BASE_PATH"

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests under the Pages path (E2E suite + deployment checks)
        run: |
          npx vite build --mode e2e-pages --outDir dist-e2e-pages
          npx playwright test --config playwright.pages.config.ts

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            reports/e2e-pages/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "## ❌ Build or tests failed — nothing was deployed"
            echo ""
            echo "Open the first red step above to see the error. Common causes:"
            echo "- **Read GitHub Pages settings** failed: Pages is not enabled. Go to Settings → Pages and set Source to **GitHub Actions**, then re-run this workflow."
            echo "- **Install dependencies** failed: package-lock.json does not match package.json. Run \`npm install\` locally and commit both files."
            echo "- **TypeScript check / tests / validation** failed: fix the reported test, or reproduce locally with \`npm test\` or \`npm run validate:math\`."
            echo "- **Verify the compiled output** failed: a file referenced by the site is missing or uses a wrong path."
            echo "- **Browser tests** failed: download the *playwright-report* artifact from this run's summary page."
            echo ""
            echo "The previously deployed version of the site (if any) is still online."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report the deployment
        if: always()
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "## ✅ Deployed: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
            echo "It can take a minute or two to appear. Reload the page twice to pick up the new version if you had it open." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Deployment failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Check Settings → Pages (Source must be **GitHub Actions**) and Settings → Environments → github-pages (the **main** branch must be allowed to deploy)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
